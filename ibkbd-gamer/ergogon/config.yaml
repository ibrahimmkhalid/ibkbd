units:
  p: 2
  angle: -14
  thumb_splay_angle: -10
  mirror_dist: 1.25U
  pU: U + p
  m2_hole_radius_pcb: 1.1
  m2_hole_insert_radius_expand: 0.7
  m2_hole_standoff_radius_expand: 1.5
  m2_height: 8 - 1.6 - 1.2 # total screw height - screw head height - adjustment
  pcb_thickness: 1.6
  parts_clearance: 2.5 + 0.8
  plate_thickness: 2
  plate_switch_hole: 13.9
  wall_height: (m2_height - pcb_thickness) + parts_clearance
  wall_thickness: 2
  switch_gap: 0.2
  switch_clip_height: 0.8
  promicro_pos_x: 0
  promicro_pos_y: 5
  promicro_angle: -90
points:
  zones:
    matrix:
      anchor:
      columns:
        outer:
        pinky:
        ring:
          key.origin: [-12, -19]
          key.stagger: 7
        middle:
          key.stagger: 7
        index:
          key.stagger: -7
        inner:
        extra:
          key.stagger: 9
          rows.num: $unset
      rows:
        bottom:
        home:
        top:
        num:
    thumbfan:
      anchor:
        ref: matrix_index_bottom
        shift: [4, -U]
      columns:
        near:
        home:
          key:
            origin: [-U/2, -U/2]
            splay: -30
        far:
          key:
            origin: [-U/2, -U/2]
            splay: -30
        gk1:
          key:
            spread: 0
            stagger: U
        gk2:
          key:
            spread: -U-3
            stagger: 0-3
            rotate: 30
        gk3:
          key:
            shift: [U+6, 0]
            rotate: -30
      rows:
        thumb:
outlines:
  _padded_keys:
    - what: rectangle
      where: true
      size: pU
  _keys_clip:
    - what: rectangle
      where: true
      size: plate_switch_hole + 0.8
  _glue_block:
    - what: polygon
      points:
        - ref: matrix_middle_num
          shift: [0.5pU, 0.5pU]
        - ref: matrix_pinky_bottom
          shift: [-0.5pU, -0.5pU]
  _promicro_slot:
    - what: rectangle
      size: [34, 18.5]
      where:
        - aggregate.parts:
            - matrix_inner_top
          shift: [promicro_pos_x, promicro_pos_y]
          rotate: promicro_angle
  _base_outline:
    - what: outline
      name: _padded_keys
    - what: outline
      name: _glue_block
  _pcb_drill:
    - what: circle
      radius: m2_hole_radius_pcb
      where: /^.*ring_home.*/
      adjust:
        shift: [-0.5*U, -0.5*U]
    - what: circle
      radius: m2_hole_radius_pcb
      where: /^.*inner_top.*/
      adjust:
        shift: [-0.5*U, 0.75*U]
  # _case_standoff_heat_inserts:
  #   - what: outline
  #     name: _pcb_drill
  #     expand: m2_hole_insert_radius_expand
  # _case_standoff:
  #   - what: outline
  #     name: _case_standoff_heat_inserts
  #     expand: m2_hole_standoff_radius_expand
  #   - what: circle
  #     radius: 6*m2_hole_radius_pcb
  #     where:
  #       - aggregate.parts:
  #           - matrix_inner_bottom
  #           - mirror_matrix_inner_bottom
  #   - what: circle
  #     radius: 2*m2_hole_radius_pcb
  #     where: /^.*(ring|middle|index|inner)_(top|bottom).*/
  #     adjust:
  #       shift: [-0.5*cx, -0.5*cy]
  _matrix_outline:
    - what: outline
      name: _base_outline
      fillet: 1
  _case_outline:
    - what: outline
      name: _matrix_outline
      expand: wall_thickness
  _wall_outline:
    - what: outline
      name: _case_outline
    - what: outline
      name: _matrix_outline
      operation: subtract
  top_plate_outline:
    - what: outline
      name: _case_outline
    - what: rectangle
      size: [plate_switch_hole, plate_switch_hole]
      where: true
      operation: subtract
    - what: outline
      name: _pcb_drill
      operation: subtract
    - what: outline
      name: _promicro_slot
      operation: subtract
    - what: outline
      name: _promicro_slot
      adjust.shift: [0, 5]
      operation: subtract
  ibkbd_gamer_pcb:
    - what: outline
      name: _matrix_outline
    - what: outline
      name: _pcb_drill
      operation: subtract
  debug_view:
    - what: rectangle
      where: true
      operation: stack
      size: [cx, cy]
    - what: outline
      name: _padded_keys
      operation: stack
    - what: outline
      name: _glue_block
      operation: stack
    - what: outline
      name: _promicro_slot
      operation: stack
    - what: outline
      name: _base_outline
      operation: stack
    - what: outline
      name: _pcb_drill
      operation: stack
    # - what: outline
    #   name: _case_standoff_heat_inserts
    #   operation: stack
    # - what: outline
    #   name: _case_standoff
    #   operation: stack
    - what: outline
      name: _matrix_outline
      operation: stack
    - what: outline
      name: _case_outline
      operation: stack
    - what: outline
      name: _wall_outline
      operation: stack
    - what: outline
      name: top_plate_outline
      operation: stack
    - what: outline
      name: ibkbd_gamer_pcb
      operation: stack
