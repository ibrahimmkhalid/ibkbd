units:
  p: 2
  angle: -14
  thumb_splay_angle: -10
  mirror_dist: 1.25U
  pU: U + p
  m2_hole_radius_pcb: 1.1
  m2_hole_insert_radius_expand: 0.7
  m2_hole_standoff_radius_expand: 1.5
  m2_height: 8 - 1.6 - 1.2 # total screw height - screw head height - adjustment
  pcb_thickness: 1.6
  parts_clearance: 2.5 + 0.8
  plate_thickness: 2
  plate_switch_hole: 13.9
  wall_height: (m2_height - pcb_thickness) + parts_clearance
  wall_thickness: 2
  switch_gap: 0.2
  switch_clip_height: 0.8
  promicro_pos_x: U - 11
  promicro_pos_y: U + 2
  promicro_l: 36
  promicro_w: 18.5
  trrs_l: 15
  trrs_w: 6
  trrs_pos_x: -2
  trrs_pos_y: U + 9
  trrs_angle: 360 - 76
  trrs_angle_rad: trrs_angle * (pi / 180)
  trrs_forward: 10
  trrs_gap: 2
points:
  zones:
    matrix:
      columns:
        outer:
        pinky:
        ring:
          key.stagger: 7
        middle:
          key.stagger: 7
        index:
          key.stagger: -7
        inner:
        extra:
          key.stagger: 9
          rows.num: $unset
      rows:
        bottom:
        home:
        top:
        num:
    thumbfan:
      anchor:
        ref: matrix_index_bottom
        shift: [4, -U]
      columns:
        near:
        home:
          key:
            origin: [-U/2, -U/2]
            splay: -30
        far:
          key:
            origin: [-U/2, -U/2]
            splay: -30
        gk1:
          key:
            spread: 0
            stagger: U
        gk2:
          key:
            spread: -U-3.5
            stagger: 0-2.5
            rotate: 30
        gk3:
          key:
            shift: [U+7, 0]
            rotate: -30
      rows:
        thumb:
outlines:
  _padded_keys:
    - what: rectangle
      where: true
      size: pU
  _keys_clip:
    - what: rectangle
      where: true
      size: plate_switch_hole + 0.8
  _glue_block:
    - what: polygon
      points:
        - ref: matrix_outer_num
          shift: [-0.5pU, 0.5pU + promicro_w + p]
        - ref: matrix_outer_bottom
          shift: [-0.5pU, -0.5pU]
        - ref: thumbfan_gk3_thumb
          shift: [0.5pU, -0.5pU]
        - ref: thumbfan_gk3_thumb
          shift: [0.5pU, 0.5pU]
        - ref: thumbfan_gk3_thumb
          shift: [-0.5pU, 0.5pU]
        - ref: matrix_extra_top
          shift: [0.5pU, 0.5pU + promicro_w + 3 + p]
  _promicro_slot:
    - what: rectangle
      size: [promicro_l + 5, promicro_w + 5]
      where:
        ref: matrix_outer_num
        shift: [promicro_pos_x - 2.5, promicro_pos_y + 2.5]
  _trrs_slot_orig:
    - what: rectangle
      size: [trrs_l, trrs_w]
      where:
        ref: matrix_extra_top
        shift: [trrs_pos_x, trrs_pos_y]
        rotate: trrs_angle
  _trrs_slot:
    - what: rectangle
      size: [trrs_l + trrs_forward + trrs_gap, trrs_w + 2 * trrs_gap]
      where:
        ref: matrix_extra_top
        shift:
          [
            trrs_pos_x - (trrs_forward - trrs_gap)/2 * cos(trrs_angle_rad),
            trrs_pos_y - (trrs_forward - trrs_gap)/2 * sin(trrs_angle_rad),
          ]
        rotate: trrs_angle
  _base_outline:
    - what: outline
      name: _padded_keys
    - what: outline
      name: _glue_block
  _pcb_drill:
    - what: circle
      radius: m2_hole_radius_pcb
      where:
        - matrix_outer_num
        - matrix_outer_bottom
        - matrix_extra_home
        - thumbfan_far_thumb
      adjust:
        shift: [0.5*U, 0.5*U]
    - what: circle
      radius: m2_hole_radius_pcb
      where:
        - matrix_index_bottom
      adjust:
        shift: [-0.5*U, -0.5*U]
    - what: circle
      radius: m2_hole_radius_pcb
      where:
        - matrix_ring_num
      adjust:
        shift: [-7, 20]
    - what: circle
      radius: m2_hole_radius_pcb
      where:
        - matrix_inner_num
      adjust:
        shift: [6.7, 20]
    - what: circle
      radius: m2_hole_radius_pcb
      where:
        - matrix_extra_top
      adjust:
        shift: [7.3, 30]
  _case_standoff_heat_inserts:
    - what: outline
      name: _pcb_drill
      expand: m2_hole_insert_radius_expand
  _case_standoff:
    - what: outline
      name: _case_standoff_heat_inserts
      expand: m2_hole_standoff_radius_expand
    - what: circle
      radius: 3*m2_hole_radius_pcb
      where:
        - ref: thumbfan_home_thumb
          shift: [0, -U]
    - what: circle
      radius: 6*m2_hole_radius_pcb
      where:
        - ref: thumbfan_near_thumb
          shift: [-U, -U/2]
    - what: circle
      radius: 6*m2_hole_radius_pcb
      where:
        - ref: thumbfan_gk2_thumb
          shift: [0, U]
    - what: circle
      radius: 2*m2_hole_radius_pcb
      where: /^.*(pinky|middle|inner|extra)_(num|bottom).*/
      adjust:
        shift: [-0.5*U, -0.5*U]
  _matrix_outline:
    - what: outline
      name: _base_outline
      fillet: 1
  _case_outline:
    - what: outline
      name: _matrix_outline
      expand: wall_thickness
  _wall_outline:
    - what: outline
      name: _case_outline
    - what: outline
      name: _matrix_outline
      operation: subtract
  top_plate_outline:
    - what: outline
      name: _case_outline
    - what: rectangle
      size: [plate_switch_hole, plate_switch_hole]
      where: true
      operation: subtract
    - what: outline
      name: _pcb_drill
      operation: subtract
    - what: outline
      name: _promicro_slot
      operation: subtract
    - what: outline
      name: _trrs_slot
      operation: subtract
  ibkbd_gamer_pcb:
    - what: outline
      name: _matrix_outline
    - what: outline
      name: _pcb_drill
      operation: subtract
  debug_view:
    - what: rectangle
      where: true
      operation: stack
      size: [U, U]
    - what: outline
      name: _padded_keys
      operation: stack
    - what: outline
      name: _glue_block
      operation: stack
    - what: outline
      name: _trrs_slot_orig
      operation: stack
    - what: outline
      name: _trrs_slot
      operation: stack
    - what: outline
      name: _promicro_slot
      operation: stack
    - what: outline
      name: _base_outline
      operation: stack
    - what: outline
      name: _pcb_drill
      operation: stack
    - what: outline
      name: _case_standoff_heat_inserts
      operation: stack
    - what: outline
      name: _case_standoff
      operation: stack
    - what: outline
      name: _matrix_outline
      operation: stack
    - what: outline
      name: _case_outline
      operation: stack
    - what: outline
      name: _wall_outline
      operation: stack
    - what: outline
      name: top_plate_outline
      operation: stack
    - what: outline
      name: ibkbd_gamer_pcb
      operation: stack
cases:
  bottom_plate:
    - what: outline
      name: _case_outline
      extrude: wall_thickness
    - what: outline
      name: _case_standoff
      operation: add
      extrude: wall_height - pcb_thickness - switch_gap
      shift: [0, 0, wall_thickness]
    - what: outline
      name: _case_standoff_heat_inserts
      operation: subtract
      extrude: wall_height - pcb_thickness - switch_gap
      shift: [0, 0, wall_thickness]
    - what: outline
      name: _wall_outline
      extrude: wall_height - parts_clearance + pcb_thickness
      shift: [0, 0, wall_thickness]
  top_plate:
    - what: outline
      name: top_plate_outline
      extrude: plate_thickness
    - what: outline
      name: _keys_clip
      extrude: switch_clip_height
      operation: subtract
pcbs:
  ibkbd_gamer_pcb:
    outlines:
      ibkbd_gamer_pcb:
        outline: ibkbd_gamer_pcb
    footprints:
      keys:
        what: mx
        where: true
        params:
          keycaps: true
          hotswap: true
          reverse: true
          from: "{{colrow}}"
          to: "{{column_net}}"
      diodes_matrix:
        what: diode
        where: true
        adjust:
          shift: [0, -5]
        params:
          to: "{{row_net}}"
          from: "{{colrow}}"
      trrs:
        what: trrs
        where:
          ref: matrix_extra_top
          shift: [trrs_pos_x + 1.1, trrs_pos_y - -5.05]
          rotate: trrs_angle + 90
        params: # placeholder
          A: GND
          B: GND
          C: GND
          D: GND
      promicro:
        what: promicro
        where:
          ref: matrix_outer_num
          shift: [promicro_pos_x, promicro_pos_y]
